<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Melaza Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Kalnia:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pagina.css">
  <style>
    /* ==========================================================================
       CONTACTO — formulario en tarjeta blanca sobre la banda roja
       Cuatro pasos numerados (como los títulos de sección del resto del sitio),
       campos rellenos sin bordes y zona para sumar imágenes de referencia.
       ========================================================================== */
    /* Toda la página es roja: la banda se funde con el fondo y la cabecera pasa a blanco */
    html, body { background: var(--primary); }
    .brand .logo, .brand .tagline, .close { color: var(--paper); }
    nav a { color: var(--paper); }
    nav a[aria-current="page"] { color: var(--sel); }
    main { padding-left: 0; }
    .band { background: transparent; border-radius: 0; animation: none; align-items: flex-start; justify-content: center; gap: clamp(2rem, 5vw, 5rem); padding: 4vh 7vw 7vh; min-height: 0; }
    /* Columna de texto con ancho fijo y título proporcional: el texto nunca invade al formulario */
    .band .head { flex: none; position: sticky; top: calc(var(--header-h) + 4vh); width: clamp(250px, 26vw, 380px); }
    .band .head p { max-width: none; text-wrap: balance; }
    .cp-direct { list-style: none; margin-top: 2rem; display: flex; flex-direction: column; gap: 1.1rem; }
    .cp-direct span { display: block; font-size: .8rem; color: var(--sel); margin-bottom: .2rem; }
    .cp-direct .wa-l { color: var(--paper); display: flex; margin-bottom: .35rem; } .cp-direct .wa-l svg { width: 1.5rem; height: 1.5rem; }
    .cp-direct a { color: var(--paper); font-size: 1rem; text-decoration: underline; text-decoration-color: rgba(250,250,250,.35); text-underline-offset: 4px; overflow-wrap: anywhere; transition: text-decoration-color .3s, opacity .3s; }
    .cp-direct a:hover, .cp-direct a:focus-visible { text-decoration-color: var(--sel); outline: none; }
    .band .head h1 { font-size: clamp(2rem, 3.6vw, 3.4rem); overflow-wrap: anywhere; }
    .cp-form { flex: 1; min-width: 0; max-width: 680px; position: relative; background: var(--paper); color: #1b1b1b; border-radius: 36px; padding: clamp(1.6rem, 3vw, 2.8rem); box-shadow: 0 18px 40px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 1.9rem; }
    .cp-sec { display: flex; align-items: baseline; gap: .8rem; margin-bottom: -.7rem; }
    .cp-n { font-family: var(--font-title); font-size: .85rem; color: var(--primary-hover); }
    .cp-sec h2 { font-family: var(--font-title); font-weight: 600; font-size: 1.15rem; color: var(--primary); }
    .cp-sec small { font-size: .78rem; color: #6b6361; }

    /* Opciones (pastillas) */
    .cp-chips { border: 0; display: flex; flex-wrap: wrap; gap: .55rem; }
    .cp-chip { cursor: pointer; }
    .cp-chip input { position: absolute; opacity: 0; pointer-events: none; }
    .cp-chip span { display: inline-flex; align-items: center; gap: .45rem; padding: .65rem 1.15rem; border-radius: 999px; background: #EFEBEA; color: #2a2a2a; font-size: .88rem; transition: background .25s, color .25s, transform .25s; }
    .cp-chip span::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: #C9C0BE; transition: background .25s; }
    .cp-chip:hover span { background: #E4DDDB; }
    .cp-chip input:checked + span { background: var(--primary); color: var(--paper); transform: translateY(-1px); }
    .cp-chip input:checked + span::before { background: var(--sel); }
    .cp-chip input:focus-visible + span { outline: 2px solid var(--sel); outline-offset: 2px; }

    /* Campos con etiqueta flotante */
    .cp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .cp-f { position: relative; display: block; min-width: 0; }
    .cp-f input, .cp-f textarea { width: 100%; font: 400 1rem var(--font-body); color: #1b1b1b; background: #EFEBEA; border: 0; border-radius: 18px; padding: 1.5rem 1.15rem .6rem; outline: none; resize: none; transition: background .25s, box-shadow .25s; }
    .cp-f textarea { min-height: 9rem; }
    .cp-f > span { position: absolute; left: 1.15rem; top: 1.05rem; font-size: .95rem; color: #7a7270; pointer-events: none; transition: transform .2s ease, font-size .2s ease, color .2s ease; transform-origin: left top; }
    .cp-f input:focus + span, .cp-f input:not(:placeholder-shown) + span,
    .cp-f textarea:focus + span, .cp-f textarea:not(:placeholder-shown) + span { transform: translateY(-.62rem); font-size: .72rem; color: var(--primary-hover); }
    .cp-f input:hover, .cp-f textarea:hover { background: #E8E2E0; }
    .cp-f input:focus, .cp-f textarea:focus { background: #fff; box-shadow: 0 0 0 3px rgba(96,15,8,.35); }

    /* Zona de imágenes */
    .cp-drop { display: flex; align-items: center; gap: 1rem; padding: 1.2rem 1.3rem; border-radius: 22px; background: #EFEBEA; cursor: pointer; transition: background .25s, box-shadow .25s; }
    .cp-drop:hover, .cp-drop.over, .cp-drop:focus-within { background: #E8E2E0; }
    .cp-drop.over { box-shadow: 0 0 0 3px rgba(96,15,8,.35); }
    .cp-drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .cp-drop .ico { flex: none; width: 3rem; height: 3rem; border-radius: 50%; background: var(--primary); color: var(--paper); display: grid; place-items: center; }
    .cp-drop .ico svg { width: 1.35rem; height: 1.35rem; }
    .cp-drop b { display: block; font-size: .95rem; color: var(--primary); }
    .cp-drop em { display: block; font-style: normal; font-size: .8rem; color: #6b6361; margin-top: .15rem; }
    .cp-thumbs { list-style: none; display: flex; flex-wrap: wrap; gap: .7rem; margin-top: -.5rem; }
    .cp-thumbs:empty { display: none; }
    .cp-thumbs li { position: relative; width: 84px; height: 84px; border-radius: 18px; overflow: hidden; background: #EFEBEA; }
    .cp-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cp-thumbs button { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: rgba(27,27,27,.78); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; display: grid; place-items: center; transition: background .2s; }
    .cp-thumbs button:hover, .cp-thumbs button:focus-visible { background: var(--primary); outline: none; }

    /* Envío */
    .cp-foot { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
    .cp-send { display: inline-flex; align-items: center; gap: .8rem; font: 600 1rem var(--font-body); color: var(--paper); background: var(--primary); border: 0; border-radius: 999px; padding: 1.1rem 2rem; cursor: pointer; transition: background .3s, transform .3s cubic-bezier(.2,.8,.2,1); }
    .cp-send:hover, .cp-send:focus-visible { background: var(--primary-hover); transform: translateY(-2px); outline: none; }
    .cp-send:disabled { opacity: .6; cursor: progress; transform: none; }
    .cp-msg { flex: 1; min-width: 12ch; min-height: 1.2em; font-size: .86rem; line-height: 1.4; color: var(--primary-hover); }
    .cp-msg.ok { color: #1F6B3A; }
    .cp-msg.err { color: #B3261E; }
    .ct-honey { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

    /* Mensaje de gracias */
    .cp-thanks { display: none; flex-direction: column; align-items: flex-start; gap: 1rem; padding: clamp(1rem, 3vw, 2rem) 0; }
    .cp-thanks .tick { width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--primary); color: var(--paper); display: grid; place-items: center; }
    .cp-thanks h2 { font-family: var(--font-title); font-style: italic; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.5rem); color: var(--primary); line-height: 1.1; }
    .cp-thanks p { font-size: .98rem; line-height: 1.6; color: #2a2a2a; max-width: 38ch; }
    .cp-thanks button { font: 600 .9rem var(--font-body); color: var(--primary); background: rgba(96,15,8,.09); border: 0; border-radius: 999px; padding: .85rem 1.5rem; cursor: pointer; transition: background .3s; }
    .cp-thanks button:hover, .cp-thanks button:focus-visible { background: rgba(96,15,8,.17); outline: none; }
    .cp-form.sent > :not(.cp-thanks) { display: none; }
    .cp-form.sent .cp-thanks { display: flex; }

    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .band .head { position: static; width: 100%; }
      .band { padding: 4vh 6vw 6vh 6vw; }
      .cp-form { width: 100%; max-width: none; border-radius: 28px; }
    }
    @media (max-width: 560px) { .cp-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html"><span class="logo">Melaza Studio</span><span class="tagline">Estudio creativo</span></a>
    <nav>
      <ul>
        <li><a href="sobre-mi.html">Sobre mí</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="band">
      <div class="head rise" style="--d:.35s">
        <span class="label">Hablemos</span>
        <h1>Conectemos</h1>
        <p>Contame tus ideas y creemos tu propia obra.</p>
        <!-- Canales directos (el mail sale de CONTACT_EMAIL en proyectos.js) -->
        <ul class="cp-direct">
          <li><span>Escribime</span><a id="cp-mail" href="#"></a></li>
          <li><span class="wa-l"><svg class="wa" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.93L2 22l5.2-1.5A9.9 9.9 0 1 0 12.04 2zm0 1.8a8.1 8.1 0 1 1-4.2 15.04l-.3-.18-3 .87.9-2.92-.2-.3A8.1 8.1 0 0 1 12.04 3.8zm-3.1 4.1c-.2 0-.5.07-.75.35-.25.28-.97.95-.97 2.3s1 2.7 1.13 2.88c.14.18 1.93 3.07 4.77 4.18 2.36.93 2.84.75 3.35.7.51-.05 1.65-.67 1.88-1.32.23-.65.23-1.2.16-1.32-.07-.12-.25-.18-.53-.32-.28-.14-1.65-.82-1.9-.91-.26-.09-.44-.14-.63.14-.18.28-.72.9-.88 1.09-.16.18-.32.2-.6.07-.28-.14-1.18-.44-2.25-1.4-.83-.74-1.39-1.65-1.55-1.93-.16-.28-.02-.43.12-.57.13-.12.28-.32.42-.49.14-.16.18-.28.28-.46.09-.19.05-.35-.02-.49-.07-.14-.63-1.5-.86-2.06-.22-.54-.45-.46-.63-.47h-.54z"/></svg></span><a id="cp-wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"></a></li>
        </ul>
      </div>
      <form id="ct-form" class="cp-form rise" style="--d:.5s" novalidate>
        <div class="cp-sec"><span class="cp-n">01</span><h2>¿Qué querés crear?</h2></div>
        <fieldset class="cp-chips" id="cp-chips"></fieldset>

        <div class="cp-sec"><span class="cp-n">02</span><h2>Tus datos</h2></div>
        <div class="cp-row">
          <label class="cp-f"><input name="nombre" type="text" autocomplete="name" placeholder=" " required><span>Nombre</span></label>
          <label class="cp-f"><input name="email" type="email" autocomplete="email" placeholder=" " required><span>Email</span></label>
        </div>

        <div class="cp-sec"><span class="cp-n">03</span><h2>Tu idea</h2></div>
        <label class="cp-f"><textarea name="mensaje" rows="5" placeholder=" " required></textarea><span>Tu mensaje</span></label>

        <div class="cp-sec"><span class="cp-n">04</span><h2>Imágenes</h2><small>Opcional</small></div>
        <label class="cp-drop" id="cp-drop">
          <input type="file" id="cp-file" accept="image/*" multiple>
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5"/><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg></span>
          <span><b>Sumá imágenes de referencia</b><em>Arrastralas hasta acá o hacé click · hasta 4 imágenes</em></span>
        </label>
        <ul class="cp-thumbs" id="cp-thumbs" aria-label="Imágenes agregadas"></ul>

        <input class="ct-honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="cp-foot">
          <button class="cp-send" type="submit"><b>Enviar mensaje</b></button>
          <p class="cp-msg" role="status" aria-live="polite"></p>
        </div>

        <div class="cp-thanks" role="status">
          <span class="tick" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <h2>¡Gracias por escribir!</h2>
          <p>Recibí tu mensaje y te respondo pronto.</p>
          <button type="button" id="cp-again">Enviar otro mensaje</button>
        </div>
      </form>
    </section>
  </main>

  <!-- CONTACT_EMAIL y el envío del formulario se definen en proyectos.js -->
  <script src="proyectos.js"></script>
  <script>
    const ctForm = document.getElementById('ct-form');
    const mailA = document.getElementById('cp-mail');
    mailA.href = 'mailto:' + CONTACT_EMAIL; mailA.textContent = CONTACT_EMAIL;
    const waA = document.getElementById('cp-wa'); waA.href = whatsappURL(); waA.textContent = CONTACT_WHATSAPP_LABEL;
    ctForm.addEventListener('submit', (e) => { e.preventDefault(); enviarContacto(ctForm); });

    // Opciones: mismas que el resto del sitio
    document.getElementById('cp-chips').innerHTML = ['Identidad de marca', 'UX / UI', 'Diseño de producto', 'Sitio web', 'Motion Graphics', 'Otros']
      .map(t => `<label class="cp-chip"><input type="checkbox" name="interes" value="${t}"><span>${t}</span></label>`).join('');

    /* Imágenes opcionales: hasta 4. Las fotos pesadas se reducen (máx. 1600 px) para que el mail no supere el límite del servicio. */
    (function () {
      const MAX = 4, LIMIT = 4.5 * 1024 * 1024;
      const drop = document.getElementById('cp-drop'), input = document.getElementById('cp-file');
      const list = document.getElementById('cp-thumbs'), msg = ctForm.querySelector('.cp-msg');
      ctForm._files = [];
      const warn = (t) => { msg.textContent = t; msg.className = 'cp-msg err'; };

      async function shrink(file) {
        if (file.size < 600 * 1024 || !/^image\/(jpeg|png|webp)$/.test(file.type) || !window.createImageBitmap) return file;
        try {
          const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
          const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
          c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
          const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', .82));
          return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
        } catch (e) { return file; }
      }
      function draw() {
        list.innerHTML = '';
        ctForm._files.forEach((f, i) => {
          const li = document.createElement('li'), im = new Image(), b = document.createElement('button');
          im.src = URL.createObjectURL(f); im.alt = f.name; im.onload = () => URL.revokeObjectURL(im.src);
          b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Quitar ' + f.name);
          b.addEventListener('click', () => { ctForm._files.splice(i, 1); draw(); });
          li.append(im, b); list.appendChild(li);
        });
      }
      async function add(files) {
        msg.textContent = ''; msg.className = 'cp-msg';
        for (const f of files) {
          if (!f.type.startsWith('image/')) { warn('Solo se pueden agregar imágenes.'); continue; }
          if (ctForm._files.length >= MAX) { warn('Podés agregar hasta ' + MAX + ' imágenes.'); break; }
          const g = await shrink(f);
          const total = ctForm._files.reduce((n, x) => n + x.size, 0) + g.size;
          if (total > LIMIT) { warn('Las imágenes pesan demasiado: probá con menos o más livianas.'); continue; }
          ctForm._files.push(g);
        }
        draw();
      }
      input.addEventListener('change', () => { add([...input.files]); input.value = ''; });
      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => add([...e.dataTransfer.files]));
      ctForm.addEventListener('reset', () => { ctForm._files = []; draw(); });
    })();

    // Enviado: se reemplaza el formulario por el mensaje de gracias
    ctForm.addEventListener('ct:sent', () => { ctForm.classList.add('sent'); });
    document.getElementById('cp-again').addEventListener('click', () => { ctForm.classList.remove('sent'); ctForm.querySelector('.cp-msg').textContent = ''; });
    window.addEventListener('pageshow', () => document.body.classList.remove('is-leaving'));
  </script>
</body>
</html>
